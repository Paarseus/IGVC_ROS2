lidar_preprocessor:
  ros__parameters:
    input_topic: /velodyne_points
    sensor_frame: velodyne
    target_frame: base_link
    range_min: 0.7
    range_max: 50.0
    # VLP-16's 16 lasers already span exactly -15/+15 deg; this is a
    # safety net, not an active crop, unless the sensor changes.
    vertical_fov_min_deg: -15.0
    vertical_fov_max_deg: 15.0
    downsample_voxel_size: 0.1
    ransac_iterations: 50
    ransac_candidate_band: 0.5
    ransac_distance_threshold: 0.1
    # Matches voxel_mapper's z_min/z_max below exactly. base_link is at
    # ground level in IGVC_ROS2 (IMU 0.5556 m above it, Velodyne ~0.71 m),
    # so this keeps obstacles between 0.2 m and 2.0 m above ground.
    height_band_min: 0.2
    height_band_max: 2.0
    sensor_timeout_sec: 0.5

voxel_mapper:
  ros__parameters:
    resolution: 0.1
    x_min: -10.0
    x_max: 10.0
    y_min: -10.0
    y_max: 10.0
    z_min: 0.2
    # 2.0 m above ground (base_link z=0).
    z_max: 2.0
    persistence_sec: 0.6
    decay_rate_hz: 2.0
    inflation_radius: 1.2
    enable_raycasting: true
    hit_logodds: 0.85
    miss_logodds: -1.0
    logodds_min: -0.8
    logodds_max: 2.0
