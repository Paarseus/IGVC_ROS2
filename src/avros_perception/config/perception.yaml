# avros_perception/perception_node parameters.
#
# camera_name drives the default ZED input topics and the output namespace:
#   subscribes: /zed_{cam}/zed_node/rgb/color/rect/image
#               /zed_{cam}/zed_node/point_cloud/cloud_registered
#   publishes:  /perception/{cam}/semantic_mask
#               /perception/{cam}/semantic_confidence
#               /perception/{cam}/semantic_points
#               /perception/{cam}/label_info
#
# rgb_topic / cloud_topic override those defaults when non-empty.

/**:
  ros__parameters:
    camera_name: 'front'
    rgb_topic: ''
    cloud_topic: ''

    # Pipeline selector: 'stub' | 'hsv' | 'sooner25' | 'adaptive' | 'onnx' (onnx lands in Phase 6).
    # 'sooner25' is the Sooner Robotics 2025 IGVC AutoNav winning approach —
    # see pipelines/sooner25.py. Switched from 'hsv' 2026-05-11 PM after the
    # legacy per-class HSV pipeline kept misclassifying bright concrete.
    # 2026-05-28 PM: switched to 'sooner25' for IGVC practice course on bright
    # asphalt. Direct HSV (V>=190 S<=15) gave near-clean detection but had a
    # few transient cracks; sooner25 with V_upper=215 gives identically clean
    # output (635 lane px stable, zero asphalt false-positives) with the same
    # tape coverage. Inverted-asphalt approach is more robust to bright-paint
    # variation. See SESSION_FINAL.md PM section for the iteration log.
    # 2026-05-30: switched to 'adaptive' — sooner25's FIXED-brightness threshold
    # flickers with the ZED auto-exposure limit cycle (lane px swung 375<->909,
    # 2.4x, at the same threshold while stationary). 'adaptive' uses a local
    # Gaussian adaptive threshold (exposure-invariant by construction), keeping
    # AE ON. See pipelines/adaptive.py + the adaptive block below.
    pipeline: 'sooner25'

    # message_filters ApproximateTimeSynchronizer
    sync_slop: 0.02        # seconds; ZED sensors_image_sync:=true keeps pairs tight
    sync_queue: 2          # 2026-05-12: down from 10 — old pairs were accumulating ~10s of lag, causing costmap Message Filter drops

    # Leave blank to fall back to avros_perception/share/config/class_map.yaml
    class_map_path: ''

    # -------- Stub-pipeline runtime knobs --------
    # Set inject_stripe_width > 0 to paint a vertical band of class_id into the mask.
    # Verify: ros2 param set /perception_node inject_stripe_width 100
    inject_stripe_width: 0
    inject_stripe_start: -1     # -1 = auto-center
    inject_class_id: 1          # must exist in class_map.yaml

    # -------- HSV-pipeline parameters --------
    # Field-calibrate these per-camera on grass at the actual course.
    # HSV is in OpenCV convention: H in [0, 179], S and V in [0, 255].
    blur_iters: 1               # 5x5 box-blur passes (Sooner 2023). 2026-05-21:
                                # 0->1 to soften dark-scene sensor speckle before
                                # thresholding without smearing the thin line.
    adaptive_period: 5          # V-floor refresh every N frames (iscumd)
    adaptive_k: 0.0             # 2026-05-28 (daylight): disabled. The 2026-05-21
                                # night value (2.5) clamps V_floor to ~255 in
                                # daylight (mean V ~140, std ~60 → 140+2.5*60=290)
                                # and excludes the entire image. Use fixed
                                # lane_low V threshold below instead. Switch back
                                # to 2.5 for night driving if needed.

    # White lane paint: low saturation, high value, hue irrelevant.
    # 2026-05-13 PM retune on a white line on grass (front of vehicle).
    # Bottom-65% of frame: grass background S median=111 p95=217, V median=147
    # p95=188. Lane-like (top 10% V + bottom 15% S): S median=66 max=82,
    # V median=210 max=255. Current default [0,0,130]/[179,80,255] caught
    # 9% of bottom-half pixels (way too much, including bright grass).
    # New thresholds: S<=60 + V>=200 catches ~1.5% (clean: line only).
    # V>=220 + S<=30 also valid (1.17%) but tighter — use if false positives
    # appear on bright grass patches.
    #
    # Prior comment block (V=222, S<=35 from walkway tuning) preserved for
    # reference, but those values were never actually in the YAML — config
    # had defaulted back to V=130 since.
    # NOTE: threshold is scene-dependent. Expect re-tuning under different
    # lighting / camera position until ONNX perception lands.
    # 2026-05-28 (daylight, asphalt, white tape): V>=180 + S<=80.
    # Captures the full tape strip across the image without picking up the
    # asphalt (V<150). Yellow parking lines correctly excluded by S<=80 (their
    # S>120). Verified iter 4 of HSV tuning session 2026-05-28 — see
    # docs/yaw_diag_session_2026_05_28/.
    #
    # NIGHT alternative (2026-05-21): with adaptive_k=2.5, use
    #   lane_low:  [0,   0,  30]
    #   lane_high: [179, 255, 255]
    # so absolute bounds just gate pure-black noise and the adaptive floor
    # handles per-frame brightness.
    lane_low:    [0,   0, 180]
    lane_high:   [179, 80, 255]
    # 3x3 erode on lane mask: 0 disables (line is <3px wide; erode would erase it)
    lane_erode_iters: 0
    # Near-field band [top_frac, bottom_frac]: restrict the adaptive V-floor
    # stats AND lane detection to this vertical slice. Excludes bright distant
    # pavement (above) + robot shadow/hood (below) that skew the adaptive floor.
    # 2026-05-21: calibrated on a white line ~3 m in front at night.
    lane_band: [0.46, 0.70]
    # Line-preserving cleanup (replaces erode for thin lines):
    lane_close_w: 11            # horizontal MORPH_CLOSE width — bridges dashes
    lane_min_area: 120          # drop connected components < this many px (speckle)
    # Run pipeline at incoming image resolution, downsample binary mask
    # to cloud shape with max-pooling (preserves thin lanes that mean-resize loses).
    process_at_full_res: true   # 2026-05-31: was false. At 224x128 the
                                # INTER_AREA downscale + block 21 (=16% of
                                # frame) blurred the faint near-field line into
                                # the asphalt BEFORE the pipeline ran, so only
                                # horizon clutter survived. Processing at full
                                # 480x300 (line crisp, block 21 ~7% of frame)
                                # then NEAREST-downsampling the binary mask
                                # recovers the real lines. Offline-verified.
    class_id_lane: 1

    # Orange safety barrels: narrow H band around 15 deg, saturated+bright
    barrel_low:  [5, 120, 100]
    barrel_high: [25, 255, 255]
    class_id_barrel: 2

    # Pothole marker: white paint ring (similar to lane but stricter V).
    # Neutered 2026-05-11 — pothole detection isn't a priority right now and
    # the previous [0,0,200]..[179,40,255] band overlapped with bright
    # concrete, painting the whole walkway magenta. Set V floor 250 and
    # S ceiling 15 so only near-pure-white pixels match; effectively off.
    pothole_low:  [0,   0, 250]
    pothole_high: [179, 15, 255]
    class_id_pothole: 3

    # ROI polygon — pixels inside the polygon are zeroed (class=free).
    # Flat [x1, y1, x2, y2, ...] array of normalized 0..1 coordinates
    # (ROS2 params don't support list-of-lists). Default: top 60% of the
    # frame masked (sky + buildings + distant trees). Calibrated 2026-04-29
    # — top 35% wasn't aggressive enough to fully kill blue sky and
    # distant tree-glare; 60% safely covers everything above the path
    # horizon at typical mounting height. Empty list disables the ROI.
    # 2026-05-21: 0.65 -> 0.46 so it does NOT overlap lane_band (0.46-0.70) —
    # the final ROI fillPoly zeros everything inside this polygon, which would
    # otherwise erase the lane it just detected. Now masks only sky/buildings
    # above the near-field band.
    # 2026-05-31: 0.46 -> 0.40 (field-tuned). Masks the horizon tents/sky;
    # the colored horizon clutter (orange barrels, tan pillar, grass) that
    # sits AT the lane-band height is removed by adaptive_max_sat instead
    # (ROI can't separate a barrel from the far end of a line — same height).
    # 0.40 cannot clip near/mid lanes (they sit lower, 0.46-1.0).
    sky_roi_poly: [0.0, 0.0,  1.0, 0.0,  1.0, 0.40,  0.0, 0.40]

    # -------- Sooner Robotics 2025 pipeline (selected via pipeline:='sooner25')
    # Copy-pasted from autonav_software_2025/transformations.py.
    # Inverted threshold: matches dim/gray asphalt (S<=upper_sat, V<=upper_val),
    # then 255-mask flips so paint + saturated objects become obstacles. Single
    # class output (everything maps to class_id_lane).
    #
    # Tuned 2026-05-11 PM on CPP walkway w/ grass:
    #   upper_sat=255 (effectively disable S threshold) — Sooner's 95 caught
    #     green grass as obstacle, which we don't want for our test course.
    #   upper_val=200 — re-tuned later same day for WHITE-PAINT-ON-GRASS
    #     scene (line on grass field, not on concrete). Grass-scene is darker
    #     overall (lower-half V mean ~174, p90 ~202) so V=215 from the
    #     concrete tuning caught nothing. V=200 sits just above scene p90,
    #     catches the worn-paint line, no false positives. V=195 also catches
    #     some specular hot-spots on grass; V=205 caught nothing.
    # Re-tune upper_val per scene — see commented sweep above.
    sooner25_lower: [0,   0,   0]
    # 2026-05-28 PM: V_upper 200 -> 215 for IGVC practice course bright
    # asphalt (asphalt p95 V=204). Sample with sample_hsv.py if scene differs.
    sooner25_upper: [255, 255, 195]
    sooner25_blur_weight: 5
    sooner25_blur_iters: 3

    # -------- Adaptive-threshold pipeline (pipeline:='adaptive') --------
    # Exposure-invariant: local Gaussian adaptive threshold on HLS-L. Rides
    # the ZED auto-exposure swing (no fixed brightness level). KEEP AE ON.
    # block/C run at FULL res (process_at_full_res:true) — the line is faint
    # (~8-12 over local mean, same contrast as asphalt speckle), so |C| can't
    # separate them; shape/area can't either (block 21 catches only line
    # edges -> fragments). The working levers are: full-res (line crisp),
    # adaptive_blur (low-pass kills high-freq speckle), adaptive_max_sat
    # (kills colored clutter). Offline-verified on captured field frames
    # 2026-05-31: clutter gone, lines traced. NOTE: faint lines remain at the
    # classical limit — ONNX is the robust answer for worn/low-contrast paint.
    adaptive_block_size: 21    # odd; > line width in px at process res
    adaptive_C: -9.0           # negative => pixel must exceed local mean (bright lines)
    adaptive_channel: 'L'      # HLS-L (or 'V'/'gray' — near-identical)
    adaptive_min_area: 130      # 2026-05-31 PM: 15->80. Field-tuned live on the
                               # IGVC practice asphalt (light/washed-out surface
                               # where asphalt aggregate speckle has local
                               # contrast comparable to the paint). 15 left
                               # scattered asphalt dots in the costmap; 80 drops
                               # the speckle comps while the lane lines (large
                               # connected comps) survive. Verified on the live
                               # published mask. May need lowering for genuinely
                               # faint/worn lines (ONNX is the robust path).
    adaptive_use_open: false   # open erases thin lines — leave off
    adaptive_blur: 11           # 2026-05-31 PM: 5->9. Bigger Gaussian low-passes
                               # the 1-3 px asphalt aggregate spikes (which
                               # otherwise out-contrast the faint paint) while
                               # the wider painted line survives. Paired with
                               # min_area 80 to clear residual speckle.
    adaptive_max_sat: 70       # 2026-05-31 NEW. Drop HLS-S>70 detections:
                               # white paint is low-S, colored clutter is high-S.
                               # 255 disables.
