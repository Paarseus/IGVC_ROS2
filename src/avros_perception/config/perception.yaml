# avros_perception/perception_node parameters.
#
# camera_name drives the default ZED input topics and the output namespace:
#   subscribes: /zed_{cam}/zed_node/rgb/color/rect/image
#               /zed_{cam}/zed_node/point_cloud/cloud_registered
#   publishes:  /perception/{cam}/semantic_mask
#               /perception/{cam}/semantic_confidence
#               /perception/{cam}/semantic_points
#               /perception/{cam}/label_info
#
# rgb_topic / cloud_topic override those defaults when non-empty.

/**:
  ros__parameters:
    camera_name: 'front'
    rgb_topic: ''
    cloud_topic: ''

    # Pipeline selector: 'stub' | 'hsv' | 'sooner25' | 'onnx' (onnx lands in Phase 6).
    # 'sooner25' is the Sooner Robotics 2025 IGVC AutoNav winning approach —
    # see pipelines/sooner25.py. Switched from 'hsv' 2026-05-11 PM after the
    # legacy per-class HSV pipeline kept misclassifying bright concrete.
    pipeline: 'hsv'

    # message_filters ApproximateTimeSynchronizer
    sync_slop: 0.02        # seconds; ZED sensors_image_sync:=true keeps pairs tight
    sync_queue: 2          # 2026-05-12: down from 10 — old pairs were accumulating ~10s of lag, causing costmap Message Filter drops

    # Leave blank to fall back to avros_perception/share/config/class_map.yaml
    class_map_path: ''

    # -------- Stub-pipeline runtime knobs --------
    # Set inject_stripe_width > 0 to paint a vertical band of class_id into the mask.
    # Verify: ros2 param set /perception_node inject_stripe_width 100
    inject_stripe_width: 0
    inject_stripe_start: -1     # -1 = auto-center
    inject_class_id: 1          # must exist in class_map.yaml

    # -------- HSV-pipeline parameters --------
    # Field-calibrate these per-camera on grass at the actual course.
    # HSV is in OpenCV convention: H in [0, 179], S and V in [0, 255].
    blur_iters: 0               # 3x 5x5 box-blur preprocessing (Sooner 2023)
    adaptive_period: 5          # V-floor refresh every N frames (iscumd)
    adaptive_k: 0.0             # V-floor = mean + k*std; k=0 disables the
                                # adaptive bright filter — use absolute
                                # lane_low V threshold instead. Calibrated
                                # 2026-04-29 daylight where the painted
                                # stripes were too dim relative to bright
                                # concrete to pass mean+k*std for k>=0.5.

    # White lane paint: low saturation, high value, hue irrelevant.
    # 2026-05-13 PM retune on a white line on grass (front of vehicle).
    # Bottom-65% of frame: grass background S median=111 p95=217, V median=147
    # p95=188. Lane-like (top 10% V + bottom 15% S): S median=66 max=82,
    # V median=210 max=255. Current default [0,0,130]/[179,80,255] caught
    # 9% of bottom-half pixels (way too much, including bright grass).
    # New thresholds: S<=60 + V>=200 catches ~1.5% (clean: line only).
    # V>=220 + S<=30 also valid (1.17%) but tighter — use if false positives
    # appear on bright grass patches.
    #
    # Prior comment block (V=222, S<=35 from walkway tuning) preserved for
    # reference, but those values were never actually in the YAML — config
    # had defaulted back to V=130 since.
    # NOTE: threshold is scene-dependent. Expect re-tuning under different
    # lighting / camera position until ONNX perception lands.
    lane_low:    [0,   0, 200]
    lane_high:   [179, 60, 255]
    # 3x3 erode on lane mask: 0 disables (line is <3px wide at 128x224 mask res)
    lane_erode_iters: 0
    # Run pipeline at incoming image resolution, downsample binary mask
    # to cloud shape with max-pooling (preserves thin lanes that mean-resize loses).
    process_at_full_res: false
    class_id_lane: 1

    # Orange safety barrels: narrow H band around 15 deg, saturated+bright
    barrel_low:  [5, 120, 100]
    barrel_high: [25, 255, 255]
    class_id_barrel: 2

    # Pothole marker: white paint ring (similar to lane but stricter V).
    # Neutered 2026-05-11 — pothole detection isn't a priority right now and
    # the previous [0,0,200]..[179,40,255] band overlapped with bright
    # concrete, painting the whole walkway magenta. Set V floor 250 and
    # S ceiling 15 so only near-pure-white pixels match; effectively off.
    pothole_low:  [0,   0, 250]
    pothole_high: [179, 15, 255]
    class_id_pothole: 3

    # ROI polygon — pixels inside the polygon are zeroed (class=free).
    # Flat [x1, y1, x2, y2, ...] array of normalized 0..1 coordinates
    # (ROS2 params don't support list-of-lists). Default: top 60% of the
    # frame masked (sky + buildings + distant trees). Calibrated 2026-04-29
    # — top 35% wasn't aggressive enough to fully kill blue sky and
    # distant tree-glare; 60% safely covers everything above the path
    # horizon at typical mounting height. Empty list disables the ROI.
    sky_roi_poly: [0.0, 0.0,  1.0, 0.0,  1.0, 0.65,  0.0, 0.65]

    # -------- Sooner Robotics 2025 pipeline (selected via pipeline:='sooner25')
    # Copy-pasted from autonav_software_2025/transformations.py.
    # Inverted threshold: matches dim/gray asphalt (S<=upper_sat, V<=upper_val),
    # then 255-mask flips so paint + saturated objects become obstacles. Single
    # class output (everything maps to class_id_lane).
    #
    # Tuned 2026-05-11 PM on CPP walkway w/ grass:
    #   upper_sat=255 (effectively disable S threshold) — Sooner's 95 caught
    #     green grass as obstacle, which we don't want for our test course.
    #   upper_val=200 — re-tuned later same day for WHITE-PAINT-ON-GRASS
    #     scene (line on grass field, not on concrete). Grass-scene is darker
    #     overall (lower-half V mean ~174, p90 ~202) so V=215 from the
    #     concrete tuning caught nothing. V=200 sits just above scene p90,
    #     catches the worn-paint line, no false positives. V=195 also catches
    #     some specular hot-spots on grass; V=205 caught nothing.
    # Re-tune upper_val per scene — see commented sweep above.
    sooner25_lower: [0,   0,   0]
    sooner25_upper: [255, 255, 200]
    sooner25_blur_weight: 5
    sooner25_blur_iters: 3
