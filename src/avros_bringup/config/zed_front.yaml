# ZED X Front Camera — override YAML layered on top of wrapper defaults
# (common_stereo.yaml + zedx.yaml) via ros_params_override_path.
#
# Serial is passed by the launch file (not this YAML). Currently using
# 49910017 (known-good unit) until the physical-front serial is verified.
#
# Topic tree (after the launch-file fix that drops explicit namespace/node_name):
#   /zed_front/zed_node/rgb/image_rect_color        (sensor_msgs/Image)
#   /zed_front/zed_node/point_cloud/cloud_registered (organized sensor_msgs/PointCloud2)
#
# camera_model, camera_name, publish_tf are set by launch args, NOT here.

/**:
  ros__parameters:
    # ZED X native resolutions: 'HD1200' | 'HD1080' | 'SVGA' | 'AUTO'.
    # Frame rates for HD1200/HD1080: 60 | 30 | 15. HD720 is NOT supported.
    # camera_name / serial_number / camera_model are set by launch args.
    general:
      grab_resolution: 'SVGA'       # 2026-05-29: HD1080->SVGA. Full ZED+perception stack
                                    # starved the 20 Hz MPPI loop (cmd_vel ~4 Hz, chassis
                                    # wandered). SVGA (~3.6x fewer px) frees a core for the
                                    # control loop. See docs/phase0_field_test_2026_05_29.md.
      grab_frame_rate: 15           # 15 valid for SVGA too
      pub_frame_rate: 8.0           # 2026-05-29: 10->8, relieve semantic layer in controller_server.
                                    # DESIGN CHOICE: kept at 8 (responsive lanes) -> cmd_vel ~13-16 Hz
                                    # with clearing:true. Dropping to ~4 would recover ~20 Hz at the
                                    # cost of slower lane updates. See docs/phase0_field_test_2026_05_29.md
                                    # "DESIGN DECISION — loop rate vs lane-layer behavior".

    depth:
      depth_mode: 'NEURAL_LIGHT'        # v5.2 enum: NONE | NEURAL_LIGHT | NEURAL | NEURAL_PLUS
      min_depth: 0.3
      max_depth: 15.0
      point_cloud_freq: 8.0             # 2026-05-29: 10->8, match pub_frame_rate for ApproximateTime sync
      point_cloud_res: 'REDUCED'        # 2026-05-29: COMPACT(256x448=114k)->REDUCED(128x224=28k).
                                        # THE fix for the lane-layer starvation: kiwicampus
                                        # bufferSegmentation processes every cloud point (full-cloud
                                        # transform + per-pixel loop) inside controller_server and
                                        # holds the buffer lock, blocking the MPPI control thread.
                                        # 4x fewer points took cmd_vel from ~3 Hz -> ~13-20 Hz with
                                        # the semantic layer ON. See docs/phase0_field_test_2026_05_29.md.
                                        # ZED wrapper only accepts COMPACT or REDUCED — no MEDIUM.
                                        # 4x fewer points for the kiwicampus layer to project,
                                        # which is the local_costmap CPU bottleneck (single-core
                                        # bound at COMPACT). 2026-05-06 measurement.
      # depth_stabilization=1 (minimum smoothing) instead of SDK-default (-1).
      # SDK default forces pos_tracking on AND runs heavier temporal filter -> 34% mean GPU.
      # Setting to 1 keeps the wrapper happy (cloud still publishes) at 27% mean GPU.
      # Setting to 0 disables cloud generation entirely on this wrapper version.
      # See docs/CHANGELOG_2026-04-27.md for diagnosis (forced pos_tracking via warning).
      depth_stabilization: 1

    # EKF+Xsens+GPS owns localization, but pos_tracking MUST be on for the
    # ZED wrapper to publish the organized point_cloud (cloud breaks if pos_tracking
    # is off, regardless of depth_mode). Set explicitly to true so the wrapper
    # doesn't print the misleading "forced to ENABLE" warning every launch.
    pos_tracking:
      pos_tracking_enabled: true
    mapping:
      mapping_enabled: false
    object_detection:
      od_enabled: false
    body_tracking:
      bt_enabled: false

    sensors:
      sensors_image_sync: true
      publish_imu: false
      publish_mag: false
      publish_baro: false
      publish_temp: false

    # 2026-06-01: exposure lock + line-detection tuning (camera-line-tune-loop: 8 iters -> clean line, 0 FP)
    video:
      auto_exposure_gain: false      # lock exposure -> kills AE limit-cycle flicker
      exposure_time: 160             # us, tuned for line/asphalt contrast (morning daylight). RE-TUNE for midday.
      analog_gain: 1000              # mDB sensor min (daylight)
      auto_whitebalance: true        # KEEP auto -> locking WB yellow-tinted the image + gated out the white line
