# ============================================================================
# avros_control actuator_node parameters
#
# Drives an AndyMark Raptor differential-track chassis. Subscribes /cmd_vel
# and /avros/actuator_command, writes per-wheel RPM setpoints to the Teensy
# 4.1 over USB serial; Teensy forwards to two SparkMAX motor controllers
# over CAN at 1 Mbit/s. Publishes /wheel_odom (50 Hz) and
# /avros/actuator_state (20 Hz).
#
# Runtime tunability — see actuator_node.py:_DYNAMIC_PARAMS:
#   [DYNAMIC]   `ros2 param set /actuator_node <name> <value>` applies immediately
#   [INIT-ONLY] requires `kill actuator_node && ros2 launch ...` to change
#
# Speed-cap context (issue #6, re-tuned 2026-05-14 on asphalt):
#   The earlier "kOutputMax_0 ≈ 0.47 firmware cap" theory was DISPROVED --
#   the ~70% RPM under-delivery was simply kP too small. With kP=0.0008 +
#   kI=5e-7 + kIZone=600 the motors track ~100% of commanded RPM; the duty
#   cycle is not clamped at 0.47. max_linear_mps below is the actuator's
#   INTERNAL clamp; the motors can now reach it.
# ============================================================================
actuator_node:
  ros__parameters:
    # ---- Teensy serial [INIT-ONLY] ----
    serial_port: "/dev/ttyACM0"
    serial_baud: 115200

    # ---- Vehicle geometry [INIT-ONLY] ----
    track_width_m: 0.7366          # 29 inches between track centerlines
    m_per_motor_rev: 0.01994       # π × 80.85 mm / 12.75:1 gearbox

    # ---- Speed safety caps [DYNAMIC] ----
    max_linear_mps: 1.5            # achievable now (issue #6 re-tune) -- the
                                   # old "kOutputMax caps at 0.70 m/s" was wrong
    max_angular_rps: 1.5           # 2026-05-12: raised 1.0 -> 1.5 to give
                                   # heading-hold room to compensate right-track
                                   # friction asymmetry without saturating the
                                   # angular command. Grass slip caps actual ω
                                   # at ~0.7 rad/s peak regardless.

    # ---- Slew-rate limits [DYNAMIC] ----
    # Smooth velocity changes to protect the 12V rail (motor inrush causes
    # Jetson brown-outs) and feel-of-motion. Time to reach max_linear_mps
    # from 0 = max_linear_mps / max_linear_accel_mps2. Decel cap can be
    # higher than accel cap for snappier stops.
    max_linear_accel_mps2: 0.5
    max_linear_decel_mps2: 1.5
    max_angular_accel_rps2: 1.0

    # ---- IMU-based straight-line assist [DYNAMIC] ----
    heading_hold_deadband: 0.05    # rad/s — |ω_cmd| below this engages heading-hold
    heading_kp: 1.5                # P gain on yaw error (rad/s output per rad error)
    yaw_rate_kp: 0.3               # P gain on ω error during commanded turns

    # ---- Timing ----
    cmd_timeout_s: 0.5             # [DYNAMIC] stop if no cmd_vel for this long
    control_rate_hz: 50.0          # [INIT-ONLY] L/R RPM setpoint update rate
    state_pub_rate_hz: 20.0        # [INIT-ONLY] /avros/actuator_state rate

    # ---- SparkMAX PID gains [DYNAMIC], pushed to Teensy on startup AND
    # whenever changed via `ros2 param set /actuator_node <gain> <value>`.
    # The Teensy forwards each K-line to BOTH SparkMAXes via CAN
    # PARAMETER_WRITE and acks with `OK K<P|I|D|F|Z>=<value>` in the
    # actuator_node log so end-to-end push can be verified.
    #
    # Re-tuned 2026-05-18 after battery relocation (COM shifted). With the
    # previous gains (kP=0.0008, kI=5e-7) the motors overshot commanded RPM
    # by 14-16% at v=1.0 m/s and 23-27% at rot=0.5 rad/s -- visible as a
    # "snap" at the end of every slew ramp. Root cause: kI integrator
    # winding up during the long slew (max_linear_accel=0.5 m/s/s takes
    # 2 s at v=1.0), then dumping the accumulated duty when the slew ends
    # and lag closes. Halving kI (5e-7 -> 2.5e-7) slowed buildup; lowering
    # kP slightly (0.0008 -> 0.0007) reduced the proportional kick. Result:
    # linear overshoot down to 0-9%, rotation overshoot down to 8-14%,
    # cumulative drift across a full fwd/rev/rot sweep down from +31.6 deg
    # to -0.085 deg, steady-state delivery 93-96% (still good for Nav2's
    # outer loop). Validated through bags pid_iter1..7_*. BURNed to flash
    # via REV Hardware Client (Velocity PID slot 0) on both SparkMAXes.
    kFF: 0.000197
    kP:  0.0007
    kI:  0.00000025
    kD:  0.0
    kIZone: 600.0

    # ---- Odometry frames [INIT-ONLY] ----
    odom_frame: "odom"
    base_frame: "base_link"
