# IGVC AutoNav waypoints — list of lat/lon points the mission_manager
# walks through IN ORDER, popping each on 2.0 m proximity (per IGVC 2026
# Rules §III.D.4 acceptance radius) or on goal result (skip-on-failure:
# an ABORTED/CANCELED waypoint is skipped, not retried).
#
# 2026-06-01: set to the surveyed IGVC MAIN-COURSE waypoints (the actual
# competition course, ~75 m WEST of the practice points) in SOUTH -> NORTH
# order — all 4 surveyed points (codes 5000/5005/5006/5001). Decoded decimal
# degrees from the official IGVC slide; see docs/igvc_2026_gps_waypoints.md.
# Sent as map-frame NavigateToPose goals via the /fromLL service; ACCURACY
# REQUIRES RTK FIXED (GPS status 2) — under SBAS the absolute targets drift.
# Place the robot on the main course facing down-course (waypoints AHEAD) so
# it drives FORWARD through them (vx_min=0, no reverse). For practice, swap in
# 5003/5004/5002 from that doc.

waypoints:
  - {lat: 42.66792771, lon: -83.21932764}   # 5000 Main South      (start)
  - {lat: 42.66807663, lon: -83.21935916}   # 5005 Main South-Mid
  - {lat: 42.66812064, lon: -83.21936061}   # 5006 Main North-Mid
  - {lat: 42.66826972, lon: -83.21934030}   # 5001 Main North
