# Velodyne VLP-16 configuration
# Package: ros-humble-velodyne (apt install)
# Sensor reconfigured to 192.168.13.11 (same subnet as Jetson)

velodyne_driver_node:
  ros__parameters:
    device_ip: "192.168.13.11"     # Reconfigured from factory 192.168.1.201
    port: 2368                     # Factory default data port
    model: "VLP16"
    rpm: 600.0
    frame_id: "velodyne"
    gps_time: false
    time_offset: 0.0
    cut_angle: 6.283185307     # 2026-05-29: full-revolution azimuth cut (2pi). Sensor double-broadcasts packets (1508/s) so default fixed npackets=76 = HALF rev @20Hz -> alternating-half clouds + precession beat starved one hemisphere every ~6s -> STVL frustum cleared it -> costmap flicker. Azimuth-cut assembles ONE true 360 rev @~10Hz, duplication-immune.

velodyne_transform_node:
  ros__parameters:
    model: "VLP16"
    min_range: 0.7                 # 2026-05-19: 1.0->0.7. Lowered to see closer
                                   # obstacles for near-zone clearing, but 0.4
                                   # self-detected a robot mount/payload at
                                   # 0.4-0.6m / ~0.6m height (verified: 45 phantom
                                   # lethal cells). 0.7 clears that structure
                                   # while still seeing 30cm closer than 1.0.
    max_range: 50.0
    calibration: "/opt/ros/humble/share/velodyne_pointcloud/params/VLP16db.yaml"
    organize_cloud: true
    fixed_frame: ""                # 2026-05-30: DESKEW OFF (was "odom", #21). The deskew published the cloud in the odom frame, so STVL anchored its frustum + raytrace clearing at the odom ORIGIN instead of the robot -> obstacles only cleared via the slow voxel_decay (~8 s) = "clearing takes too long". Empty fixed_frame -> cloud in the velodyne (sensor) frame -> STVL clears from the robot again (fast), and the #21 marking-range blindness goes away too. Tradeoff: ~11% rotation phantom-arc returns, mitigated by mark_threshold:1.
                                   # compensation (computeTransformToFixed). VLP-16
                                   # sweeps ~100ms; during in-place rotation late-sweep
                                   # points were mis-rotated into a phantom arc in the
                                   # costmap. Transforming each packet via odom->velodyne
                                   # TF at its own stamp removes scan-skew at the source.
                                   # NOTE: changes output cloud frame_id velodyne->odom.
