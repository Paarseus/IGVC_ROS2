# Xsens MTi-680G configuration
# Package: xsens_mti_ros2_driver (build from source via avros.repos)
# Fork: https://github.com/Paarseus/Xsens_MTi_ROS_Driver_and_Ntrip_Client (ros2 branch)

xsens_mti_node:
  ros__parameters:
    # Device
    scan_for_devices: true
    port: "/dev/ttyUSB0"
    baudrate: 921600                # Flashed from 115200 on 2026-03-01
    serial_timeout: 150            # Increase for Jetson (default 100ms)
    frame_id: "imu_link"

    # Output rate
    enable_deviceConfig: false     # 2026-05-30: GNSS_LeverArm (0.74 m) already flashed (nav ran clean to wp 5004). Back to false so it stops re-flashing the MTi firmware every boot. Set true ONCE only when changing a flashed device param (lever arm, filter profile).
    output_data_rate: 100          # Hz

    # Publishers
    publisher_queue_size: 5
    pub_imu: true
    pub_quaternion: true
    pub_euler: true
    pub_free_acceleration: true
    pub_angular_velocity: true
    pub_acceleration: true
    pub_mag: true
    pub_dq: false
    pub_dv: false
    pub_pressure: false
    pub_temperature: false
    pub_transform: false          # URDF provides base_link -> imu_link
    pub_status: true
    pub_utctime: true
    pub_sampletime: true

    # GNSS (MTi-680G)
    pub_twist: true
    pub_gnss: true
    pub_positionLLA: true
    pub_velocity: true
    pub_nmea: true
    pub_gnsspose: false             # Disable — creates TF loop with EKF + navsat_transform
    pub_odometry: false             # Disable — publishes imu_link->base_link TF that conflicts with URDF + EKF (REP 105 violation)

    # GNSS lever arm: antenna offset from IMU center [x, y, z] meters
    # 2026-05-30: MEASURED — antenna 0.74 m in FRONT of the IMU (+X forward; imu_link is base_link-aligned).
    GNSS_LeverArm: [0.74, 0.0, 0.0]   # corrects fused position to the IMU origin + removes the omega*r velocity error on turns. If the MTi is physically mounted rotated, adjust the axis/sign.

    # u-Blox platform type: 4 = Automotive
    ublox_platform: 4
    enable_beidou: false

    # Filter options
    enable_orientation_smoother: true
    enable_position_velocity_smoother: true
    enable_continuous_zero_rotation_update: true
