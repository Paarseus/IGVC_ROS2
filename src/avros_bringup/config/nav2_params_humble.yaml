# Nav2 parameters for AVROS — Humble version
# Differential-drive tracked chassis (AndyMark Raptor), 0.7366 m track gauge.
# Can rotate in place and reverse; not Ackermann.
#
# Phase A migration 2026-05-06: aligned planner+controller with the
# professional outdoor diff-drive consensus (Clearpath Husky/Jackal/Warthog,
# AgileX Scout, Macenski's RosCon 2023 MPPI talk):
#   - Planner:    SmacPlannerHybrid (DUBIN, 2.31 m radius) → NavfnPlanner
#   - Controller: RegulatedPurePursuit (Ackermann tuning) → MPPIController
#                 with motion_model: DiffDrive
#   - Inflation:  radius 0.5 → 1.0 (was < inscribed_radius 0.794),
#                 cost_scaling_factor 5.0 → 3.0 (smoother gradient required
#                 by MPPI per Macenski; sharp inflation defeats MPPI critic)
#
# KEEP IN SYNC with nav2_params.yaml (Jazzy). Differences:
#   - bt_navigator.plugin_lib_names: required (Jazzy auto-discovers)
#   - planner/behavior plugins: '/' notation (Jazzy uses '::')

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # BT XML path resolved at launch time via navigation.launch.py
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    goal_reached_tol: 3.0       # GoalReached BT condition tolerance (meters)
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Humble requires explicit BT plugin list (Jazzy auto-discovers)
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node    # for navigate_to_pose_simple_humble.xml (ComputePathToPose)
      - nav2_compute_route_bt_node                  # for navigate_route_graph_humble.xml (ComputeRoute)
      - nav2_follow_path_action_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_back_up_action_bt_node                 # for navigate_igvc_autonav_humble.xml (BackUp)
      - nav2_drive_on_heading_bt_node        # for navigate_igvc_autonav_humble.xml (DriveOnHeading)

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    progress_checker_plugin: "progress_checker"   # Humble: singular string (not list)
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 120.0    # 2 min — patient enough for pedestrians/temporary obstacles

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 2.0
      yaw_goal_tolerance: 0.5
      stateful: true

    # MPPIController — sampling-based MPC. Replaces RPP per Macenski's
    # explicit recommendation for diff-drive that needs to maneuver around
    # obstacles (RPP only follows; MPPI generates trajectories around).
    # Numerics adopted verbatim from Clearpath A300/J100/W200 production
    # configs — the universal "out-of-the-box" diff-drive tune.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000        # 2026-05-21: 2000->1000. Nav2 doc sweet spot for
                              # constrained HW; halves optimizer cost so the 20 Hz
                              # control loop holds on the Jetson Orin under load.
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # vx_max/vx_min: matches the firmware ceiling on grass per
      # docs/F_firmware_characterization_report.md (2026-05-12). SparkMAX
      # kOutputMax_0 ≈ 0.47 caps the wheel duty → ~0.70 m/s achievable
      # regardless of /cmd_vel. MPPI samples rollouts up to vx_max; setting
      # this higher than what the motors can deliver causes rollout trajectories
      # MPPI believes-in-but-cannot-execute, which hurts tracking.
      # Raise to 1.5 after bench-fixing kOutputMax via REV Hardware Client.
      vx_max: 0.7             # m/s forward (was 0.5; raised after T3.3 confirmed motors reach 0.7)
      vx_min: -0.4            # m/s reverse (symmetric scaling with vx_max)
      vy_max: 0.5             # not used on diff-drive but required field
      # wz_max: actuator clamps angular at max_angular_rps=1.5 (raised from
      # 1.0 on 2026-05-12); grass slip caps achievable ω at ~0.7 rad/s peak.
      # Keeping wz_max high here lets MPPI sample full range — actuator
      # will clamp downstream.
      wz_max: 1.9             # rad/s
      # Acceleration limits (2026-05-19): matched to actuator_params.yaml slew
      # caps so MPPI samples trajectories the chassis can actually deliver.
      # Mismatch (defaults are 3.0/3.5) causes MPPI to plan accels reality
      # can't follow → lateral path error grows as chassis lags predictions.
      # Values are slightly above chassis caps to give MPPI sampling room
      # without producing trajectories MPPI believes-in-but-cannot-execute.
      # Chassis caps (actuator_params.yaml):
      #   max_linear_accel_mps2:   0.3   -> ax_max  = 0.4  (1.33x)
      #   max_linear_decel_mps2:   1.3   -> ax_min  = -1.5 (1.15x — safety dodge room)
      #   max_angular_accel_rps2:  1.2   -> az_max  = 1.5  (1.25x)
      # ay_max irrelevant for DiffDrive motion_model (no lateral motion).
      ax_max: 0.4
      ax_min: -1.5
      ay_max: 3.0             # unused for diff-drive; keep at default
      az_max: 1.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0        # 2026-05-12: REVERTED to canonical default after multi-agent research. critical_cost is a penalty MAGNITUDE added when pose_cost >= INSCRIBED_INFLATED_OBSTACLE (253), not a threshold.
        consider_footprint: true     # 2026-05-12: sweep robot_radius along trajectory — center-only checking was letting MPPI drive over thin painted lanes
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        mode: 0

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]

    # NavfnPlanner (Dijkstra) — adopted as the diff-drive default per
    # Clearpath Husky/Jackal/Warthog, Macenski's docs, and the IGVC team
    # consensus. SmacPlannerHybrid was the wrong tool: it's documented
    # for car-like/Ackermann/legged platforms, and DUBIN with 2.31 m
    # min_turning_radius prevented the planner from fitting paths
    # between visible lane lines (which are only 2-3 m apart at the
    # IGVC course).
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false        # Dijkstra (Clearpath default); A* if you want speed at cost of optimality
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    # 2026-05-12: added accel/decel limits to backup + drive_on_heading.
    # Without them, the behaviors emit "no acceleration or deceleration limits set"
    # and Aborting handle instantly. Limits matched to actuator_node slew caps.
    backup:
      plugin: "nav2_behaviors/BackUp"               # Humble: '/' (has name= in plugin.xml)
      acceleration_limit: 1.5      # m/s^2 — matches actuator_node max_linear_decel
      deceleration_limit: -1.5     # m/s^2
      minimum_speed: 0.05          # m/s — below this the behavior reports success
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"        # Humble: '/'
      acceleration_limit: 1.0      # m/s^2 — matches actuator_node max_linear_accel
      deceleration_limit: -1.0     # m/s^2
      minimum_speed: 0.05          # m/s
    wait:
      plugin: "nav2_behaviors/Wait"                  # Humble: '/'

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      always_send_full_costmap: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.2
      robot_radius: 0.8
      # 2026-05-12: explicit rectangular footprint required by MPPI CostCritic.consider_footprint=true.
      # Dimensions match BT comment (1.0m x 0.74m); origin at base_link center, +X forward.
      footprint: "[[0.5, 0.37], [-0.5, 0.37], [-0.5, -0.37], [0.5, -0.37]]"
      # stvl_layer first so semantic_layer's LETHAL writes win on cell conflict via updateWithMax.
      # STVL (spatio_temporal_voxel_layer) replaces nav2_costmap_2d::VoxelLayer
      # for the Velodyne VLP-16 source. voxel_layer is structurally wrong for
      # sparse 3D LiDAR + stationary-prone robot: it clears cells only via
      # raytrace from sensor through the cell to a free-space endpoint, but
      # VLP-16's 16-beam 2 deg ring spacing leaves wide angular gaps unswept
      # per scan; when stationary that gap pattern is frozen, and any cell
      # with no return beyond it (barrel removed -> laser sees sky) cannot
      # be cleared by raytrace. inf_is_valid is hard-coded to LaserScan in
      # nav2 humble (obstacle_layer.cpp:194-197 logs "not applicable to
      # PointCloud observations"). STVL clears via voxel_decay (time) and
      # decay_acceleration (frustum), which works on a stationary robot.
      # Recommended by Steve Macenski (nav2 maintainer) for VLP-16; used by
      # his vlp16_config.yaml, OmniLRS, and Jackal-UAO. Migrated 2026-05-13.
      plugins: ["stvl_layer", "semantic_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 8.0           # 2026-05-21: 2.0->8.0. Anti-flicker: sparse
                                   # VLP-16 + CPU-load bursts decayed obstacles out
                                   # (~40% of lethal cells lost while stationary).
                                   # Long timeout = persistence; odom frame has no
                                   # GPS smear to cap. See docs/lidar_obstacle_avoidance_test_2026_05_21.md
        decay_model: 0             # 0=linear, 1=exponential, -1=persistent
        voxel_size: 0.1            # 10 cm voxels
        publish_voxel_map: true    # /.../stvl_layer/voxel_marked_cloud + voxel_grid
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1      # Max (matches voxel_layer default)
        mapping_mode: false        # ephemeral local costmap (not building a map)
        observation_sources: velodyne_points
        velodyne_points:
          topic: /velodyne_points
          data_type: PointCloud2
          marking: true
          clearing: true
          # min_obstacle_height is in the GLOBAL frame (odom for local_costmap),
          # NOT the sensor frame -- confirmed in nav2_costmap_2d Humble source:
          # ObservationBuffer::bufferCloud transforms cloud to global_frame_
          # BEFORE the z check (lines 159-187 in observation_buffer.cpp).
          # So 0 = ground level, positive = above ground, negative = below.
          #
          # 2026-05-13 V3 field tuning at CPP grass with the misinterpretation
          # corrected: 0.2 filters under-ground multipath (~31% of returns) +
          # ground hits + low grass while still marking short barrels (0.5+ m)
          # and people (1+ m). Measured z-distribution at this site:
          #   z<0     : 31% multipath/below-ground
          #   0-0.2   : 18% ground + low grass
          #   0.2-0.5 : 5%  tall grass / curbs
          #   0.5-1   : 2%  barrels + at-sensor
          #   1-2     : 8%  people / posts
          #   >2      : 35% buildings / trees / high structures
          # Set to 0.3 if grass is taller than 0.2 m at the test site.
          min_obstacle_height: 0.2
          max_obstacle_height: 2.0
          obstacle_range: 15.0           # was obstacle_max_range in voxel_layer
          # VLP-16 hourglass FOV for frustum-accelerated decay
          model_type: 1                  # 1 = 3D LiDAR; 0 = depth camera
          vertical_fov_angle: 0.523      # VLP-16 +/-15 deg
          # 2026-05-19: widen the near cone so close LOW voxels register as
          # in-frustum -> get fast frustum-accelerated decay instead of the
          # slow 5s timeout (was the near-front smear cause).
          vertical_fov_padding: 0.1
          horizontal_fov_angle: 6.283    # 360 deg
          # decay_acceleration: accelerate decay of in-frustum voxels that get
          # no confirming return (units 1/s^2). 2026-05-21: 10.0->5.0 — at 10 it
          # was the DOMINANT clearing path for sparse VLP-16 (not voxel_decay)
          # and drove the stationary flicker; lower = lean on the timeout instead.
          decay_acceleration: 5.0
          clear_after_reading: true

      # kiwicampus/semantic_segmentation_layer — consumes the avros_perception 3-topic contract
      # from the front ZED X. Additive to voxel_layer; it writes cost from camera-classified
      # pixels (lane paint, barrels, etc) that LiDAR cannot see.
      # Single SemanticSegmentationLayer instance with three ZED X sources.
      # Per pepisg/nav2_segmentation_demo (the upstream reference): one plugin
      # instance, multiple observation_sources nested under it. Three separate
      # plugin instances do NOT propagate tiles to the master grid.
      #
      # tile_map_decay_time: 0.3 — kiwicampus default. Stable with the
      # patches/kiwicampus_pr3_raytrace_clear.patch applied: the raytrace
      # pass actively writes FREE_SPACE through cells the camera "sees
      # through", so cells don't depend on a long decay window to clear.
      # 2026-04-28 we briefly bumped this to 5.0 as a workaround when the
      # plugin had no clearing path; PR3 reverts it.
      # Below the 1/grab_frame_rate frame interval (~100ms at 10 Hz) cells
      # flicker as observations are purged faster than they're refreshed.
      semantic_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: true
        observation_sources: front
        front:
          segmentation_topic: /perception/front/semantic_mask
          pointcloud_topic: /perception/front/semantic_points
          confidence_topic: /perception/front/semantic_confidence
          labels_topic: /perception/front/label_info
          max_obstacle_distance: 5.0
          min_obstacle_distance: 0.3
          tile_map_decay_time: 0.3
          observation_persistence: 0.0
          clearing: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.0
          visualize_tile_map: true
          use_cost_selection: false
          class_types: ["danger", "ignored"]
          danger:
            classes: ["lane_white", "barrel_orange", "pothole"]
            base_cost: 254
            max_cost: 254
            mark_confidence: 1
            samples_to_max_cost: 1
            dominant_priority: false
          # 'free' (id 0) and 'unknown' (id 255) are advertised by perception_node's
          # LabelInfo (see avros_perception/config/class_map.yaml) but must not mark
          # any cells. Without an "ignored" class_type, kiwicampus logs
          #   CRITICAL ERROR: Class '<name>' from label_info is not defined ...
          # once per source on activation (segmentation_buffer.cpp:99).
          # samples_to_max_cost: 999999 makes the marking gate at
          # segmentation_buffer.cpp:387 unreachable, so cells are never painted.
          ignored:
            classes: ["free", "unknown"]
            base_cost: 0
            max_cost: 0
            mark_confidence: 0
            samples_to_max_cost: 999999
            dominant_priority: false
        left:
          segmentation_topic: /perception/left/semantic_mask
          pointcloud_topic: /perception/left/semantic_points
          confidence_topic: /perception/left/semantic_confidence
          labels_topic: /perception/left/label_info
          max_obstacle_distance: 5.0
          min_obstacle_distance: 0.3
          tile_map_decay_time: 0.3
          observation_persistence: 0.0
          clearing: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.0
          visualize_tile_map: false
          use_cost_selection: false
          class_types: ["danger", "ignored"]
          danger:
            classes: ["lane_white", "barrel_orange", "pothole"]
            base_cost: 254
            max_cost: 254
            mark_confidence: 1
            samples_to_max_cost: 1
            dominant_priority: false
          # 'free' (id 0) and 'unknown' (id 255) are advertised by perception_node's
          # LabelInfo (see avros_perception/config/class_map.yaml) but must not mark
          # any cells. Without an "ignored" class_type, kiwicampus logs
          #   CRITICAL ERROR: Class '<name>' from label_info is not defined ...
          # once per source on activation (segmentation_buffer.cpp:99).
          # samples_to_max_cost: 999999 makes the marking gate at
          # segmentation_buffer.cpp:387 unreachable, so cells are never painted.
          ignored:
            classes: ["free", "unknown"]
            base_cost: 0
            max_cost: 0
            mark_confidence: 0
            samples_to_max_cost: 999999
            dominant_priority: false
        right:
          segmentation_topic: /perception/right/semantic_mask
          pointcloud_topic: /perception/right/semantic_points
          confidence_topic: /perception/right/semantic_confidence
          labels_topic: /perception/right/label_info
          max_obstacle_distance: 5.0
          min_obstacle_distance: 0.3
          tile_map_decay_time: 0.3
          observation_persistence: 0.0
          clearing: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.0
          visualize_tile_map: false
          use_cost_selection: false
          class_types: ["danger", "ignored"]
          danger:
            classes: ["lane_white", "barrel_orange", "pothole"]
            base_cost: 254
            max_cost: 254
            mark_confidence: 1
            samples_to_max_cost: 1
            dominant_priority: false
          # 'free' (id 0) and 'unknown' (id 255) are advertised by perception_node's
          # LabelInfo (see avros_perception/config/class_map.yaml) but must not mark
          # any cells. Without an "ignored" class_type, kiwicampus logs
          #   CRITICAL ERROR: Class '<name>' from label_info is not defined ...
          # once per source on activation (segmentation_buffer.cpp:99).
          # samples_to_max_cost: 999999 makes the marking gate at
          # segmentation_buffer.cpp:387 unreachable, so cells are never painted.
          ignored:
            classes: ["free", "unknown"]
            base_cost: 0
            max_cost: 0
            mark_confidence: 0
            samples_to_max_cost: 999999
            dominant_priority: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0     # smoother gradient — required by MPPI per Macenski
        inflation_radius: 1.0       # 2026-05-21: 0.65->1.0. Now >= robot_radius (0.8)
                                     # so MPPI gets a real early-avoidance gradient instead
                                     # of cutting obstacles close. The old "1.0 boxed the
                                     # robot in" concern was camera-lane + GPS-smear lethal
                                     # blobs in the GLOBAL (map) costmap; this LOCAL costmap
                                     # is odom frame with no smear source, so 1.0 is safe.
                                     # Global inflation left at 0.65 (see below). History:
                                     # 0.4 warned (< inscribed 0.794); 0.65 was the interim.

global_costmap:
  global_costmap:
    ros__parameters:
      # 2026-05-19 (L6 fix): 10 Hz + STVL time-decay + 40 m rolling window to
      # stop GPS-drift phantom accumulation. The plain ObstacleLayer had NO
      # decay, so off-ray cells from ~8 cm/s map->odom drift piled up
      # (measured 5878 -> 24567 lethal in a 40 s drive; local STVL cleared in
      # ~1 s over the same test). STVL gives the global the same time-based
      # decay the local already has; the 40 m window lets residual smear fall
      # off the trailing edge. publish 2 Hz so RViz/consumers see fresh data.
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.2
      robot_radius: 0.8
      # 2026-05-12: explicit rectangular footprint required by MPPI CostCritic.consider_footprint=true.
      # Dimensions match BT comment (1.0m x 0.74m); origin at base_link center, +X forward.
      footprint: "[[0.5, 0.37], [-0.5, 0.37], [-0.5, -0.37], [0.5, -0.37]]"
      track_unknown_space: false
      # 2026-05-12: semantic_layer intentionally REMOVED from global_costmap.
      # Rationale: painted-lane perception (camera, short range, no raytrace
      # clearing, sensitive to map→odom drift) smears in the global costmap
      # under unaided GPS. Matches TnTech IGVC 2026 + SoonerRobotics 2024+2025
      # pattern: painted lanes live only in the LOCAL costmap (odom frame),
      # MPPI handles all lane avoidance via its 3m planning horizon. Geometric
      # 3D obstacles (LiDAR / Velodyne) continue to live in BOTH costmaps via
      # obstacle_layer below — they have long range, raytrace clearing, and
      # stable TF chains that justify routing-level awareness. The semantic_layer:
      # block below is retained but DISABLED so the config is easy to revert.
      plugins: ["stvl_layer", "inflation_layer"]

      # 2026-05-19 (L6 fix): was nav2_costmap_2d::ObstacleLayer (raytrace-only,
      # no decay). Swapped to STVL to mirror the local costmap's time-decay so
      # GPS-drift phantoms evaporate instead of accumulating. obstacle_range 20 m
      # fits the 40 m rolling window (±20 m). All other params mirror the
      # local stvl_layer; see local_costmap.stvl_layer above for rationale.
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 5.0           # 2026-05-21: 2.0->5.0. Modest bump only (NOT 8
                                   # like local) — global is map frame, so a long
                                   # decay smears GPS-drift phantoms; 5 balances
                                   # obstacle persistence vs smear accumulation.
        decay_model: 0             # 0=linear
        voxel_size: 0.1
        publish_voxel_map: false   # global; no need for voxel debug cloud
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        mapping_mode: false
        observation_sources: velodyne_points
        velodyne_points:
          topic: /velodyne_points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.2
          max_obstacle_height: 2.0
          obstacle_range: 20.0           # fits the 40 m rolling window
          model_type: 1                  # 3D LiDAR (frustum-accelerated decay)
          vertical_fov_angle: 0.523      # VLP-16 +/-15 deg
          vertical_fov_padding: 0.1      # 2026-05-19: widen near cone (match local)
          horizontal_fov_angle: 6.283    # 360 deg
          decay_acceleration: 5.0       # 2026-05-21: 10->5 (match local anti-flicker)
          clear_after_reading: true

      # Mirror of local_costmap.semantic_layer — RETAINED BUT NOT IN PLUGINS LIST
      # as of 2026-05-12 (see plugins-list comment above for full rationale).
      # The block is left below for documentation + easy revert (just add back
      # "semantic_layer" to the plugins list above).
      semantic_layer:
        plugin: "semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: false
        observation_sources: front
        front:
          segmentation_topic: /perception/front/semantic_mask
          pointcloud_topic: /perception/front/semantic_points
          confidence_topic: /perception/front/semantic_confidence
          labels_topic: /perception/front/label_info
          max_obstacle_distance: 5.0
          min_obstacle_distance: 0.3
          # 2026-05-11 PM: dropped from 1.5 -> 0.5 + raytrace 8 -> 30 so
          # drift-leftover cells in the map frame clear faster. SBAS GPS
          # drifts ~30 cm per fix, so each observation lands at a fresh
          # map-frame position; old cells stayed lethal for 1.5 s and
          # accumulated into phantom blobs. Shorter decay + wider raytrace
          # range catches stale cells via the new observation's clearing ray.
          tile_map_decay_time: 0.3
          observation_persistence: 0.0
          clearing: true
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.0
          visualize_tile_map: false
          use_cost_selection: false
          class_types: ["danger", "ignored"]
          danger:
            classes: ["lane_white", "barrel_orange", "pothole"]
            base_cost: 254
            max_cost: 254
            mark_confidence: 1
            samples_to_max_cost: 1
            dominant_priority: false
          # 'free' (id 0) and 'unknown' (id 255) are advertised by perception_node's
          # LabelInfo (see avros_perception/config/class_map.yaml) but must not mark
          # any cells. Without an "ignored" class_type, kiwicampus logs
          #   CRITICAL ERROR: Class '<name>' from label_info is not defined ...
          # once per source on activation (segmentation_buffer.cpp:99).
          # samples_to_max_cost: 999999 makes the marking gate at
          # segmentation_buffer.cpp:387 unreachable, so cells are never painted.
          ignored:
            classes: ["free", "unknown"]
            base_cost: 0
            max_cost: 0
            mark_confidence: 0
            samples_to_max_cost: 999999
            dominant_priority: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0     # smoother gradient — required by MPPI per Macenski
        inflation_radius: 0.65       # 2026-05-12: bumped from 0.4 (was < inscribed radius 0.5 — disabled MPPI fast-path & emitted warning). Original 1.0 was over-aggressive; 0.65 = inscribed + small margin.
                                     # detections accumulated into a lethal blob that boxed
                                     # in the robot. 0.4 < inscribed_radius (0.794) so Nav2
                                     # will warn; accepted trade-off until lane detection
                                     # produces paired stripes the planner can corridor between.

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 1.0]       # [vx, vy, omega]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

route_server:
  ros__parameters:
    base_frame: "base_link"
    route_frame: "map"
    global_frame: "map"
    max_planning_time: 2.0
    prune_route: true
    path_density: 0.5
    smooth_corners: false             # dense graph nodes follow road curves; smoothing can distort path
    graph_filepath: ""   # Overridden at launch time
    graph_file_loader: "GeoJsonGraphFileLoader"
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
      weight: 1.0
    GeoJsonGraphFileLoader:
      plugin: "nav2_route::GeoJsonGraphFileLoader"
    edge_cost_functions: ["DistanceScorer"]
