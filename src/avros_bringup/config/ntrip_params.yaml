# NTRIP client configuration for RTK corrections
# The ntrip node bridges GPGGA from /nmea to an NTRIP caster
# and publishes RTCM3 corrections on /rtcm for the Xsens MTi-680G.
#
# Fill in your NTRIP caster credentials below.
# Free casters: RTK2go (rtk2go.com:2101), UNAVCO, state DOT networks
# Example mountpoint for Southern California: PPBF_RTCM3 (rtk2go.com)

# ===== ACTIVE: MDOT CORS / MSRN — free Michigan state network (best for Oakland University / IGVC) =====
# NS-IMAX-MSM4 is a network/iMAX (VRS-style) solution: the caster synthesizes a virtual base
# at the robot's GGA position, so the effective baseline is ~0 km anywhere on the course.
# MSM4 = RTCM 3.2 full GNSS (GPS 1074 / GLO 1084 / GAL 1094 / BDS 1124) — matches the MTi-680G (u-blox F9P).
# Prereqs: free account at mdotcors.org, then Shop -> "Subscribe Now" on "MSM4 (Standard GNSS messages)".
# NTRIP auth = your SBC web login UNLESS you set separate Ntrip user/pass in Account Details -> My Profile.
# MDOT requires the rover to upload GGA at least every 30 s (update_rate handles this).
ntrip_client:
  ros__parameters:
    host: "148.149.0.87"               # MDOT CORS/MSRN NTRIP caster IP (from official MSRN Port List, eff. 2021-04-15).
                                       # NOT mdotcors.michigan.gov — that is the Cloudflare web portal; :10010 is blocked there.
    port: 10010                        # MSM4 network-solution port (RTCM 3.2, GNSS)
    mountpoint: "NS-IMAX-MSM4"         # "Network Solution - AMC" — MDOT's recommended standard mountpoint
    username: "parsaghasemi0"           # SBC login (NTRIP user field blank -> inherits this)
    password: "Aisa@2329"               # SBC login password (NTRIP pass field blank -> inherits this)
    update_rate: 1.0

